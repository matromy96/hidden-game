<style>
  html,body{
    margin:0; padding:0; background:#000; height:100%; overflow:hidden;
    position:fixed; inset:0; /* evita que Safari mueva el layout al mostrar/ocultar su barra */
  }
  body{
    display:flex; align-items:center; justify-content:center;
    width:100%; height:100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing:border-box;
  }
  canvas{
    /* El truco: calculamos ancho y alto a partir del MISMO límite (el que sea
       más restrictivo), así la proporción 450:800 nunca se rompe, sin
       depender de que el WebView de Android soporte bien aspect-ratio. */
    width: min(100vw, calc(100vh * 450 / 800));
    height: min(100vh, calc(100vw * 800 / 450));
    width: min(100vw, calc(100dvh * 450 / 800));
    height: min(100dvh, calc(100vw * 800 / 450));
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    cursor: pointer;
  }
</style>
</head>

<script>
(async function(){
"use strict";

// --- comprobación automática de versión de assets -------------------------
// al arrancar, el juego pide (sin caché) el archivo version.txt de al lado
// del index.html. Ese archivo solo contiene un número/texto de versión.
// Cada vez que subís assets nuevos o modificados a GitHub, subí también
// version.txt con un valor distinto (ej. de "3" a "4"). Eso hace que TODAS
// las URLs de imágenes y audio de esta página cambien (?v=4 en vez de ?v=3),
// así el navegador las trata como archivos nuevos y nunca mezcla caché vieja
// con contenido nuevo. Si version.txt no existe o falla la red, el juego
// sigue funcionando igual, solo que sin el cache-busting.
let ASSET_VERSION = '0';
try {
  const versionRes = await fetch('version.txt', {cache: 'no-store'});
  if(versionRes.ok) ASSET_VERSION = (await versionRes.text()).trim();
} catch(err){
  console.error('[cache] No se pudo comprobar version.txt, se usará la caché del navegador tal cual.', err);
}
// agrega el número de versión como query string a cualquier URL de asset
function withVersion(src){
  return src + (src.indexOf('?')===-1 ? '?' : '&') + 'v=' + ASSET_VERSION;
}

const RAW = JSON.parse(document.getElementById('sprite-data').textContent);

// cargar los sprites de los personajes
const CHAR_DATA = {};
for(const cname in RAW){
  const info = RAW[cname];
  CHAR_DATA[cname] = {w: info.w, h: info.h, variants:{}, icons:{}, masks:{}};
  for(const vname in info.variants){
    CHAR_DATA[cname].variants[vname] = info.variants[vname].map(src=>{
      const img = new Image();
      img.src = withVersion(src);
      return img;
    });
    // máscara de alpha por frame, mismo tamaño del sprite (no toda la pantalla),
    // para que el click sobre un personaje coincida con su silueta real y no con
    // el rectángulo completo (que incluye el margen transparente del png)
    CHAR_DATA[cname].masks[vname] = CHAR_DATA[cname].variants[vname].map(img=>
      buildSpriteMask(img, info.w, info.h)
    );
  }
  const icons = info.icons || {};
  for(const vname in icons){
    const img = new Image();
    img.src = withVersion(icons[vname]);
    CHAR_DATA[cname].icons[vname] = img;
  }
}
const CHAR_NAMES = Object.keys(CHAR_DATA);
function variantsOf(cname){ return Object.keys(CHAR_DATA[cname].variants); }

// canvas
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 450, H = 800;
const TARGET_ZONE_H = 130;   // arriba queda espacio para el sprite objetivo
const FIELD_TOP = TARGET_ZONE_H;
const FIELD_BOTTOM = H;

// fondo
function loadImg(src){ const img = new Image(); img.src = withVersion(src); return img; }

function drawImgNative(img, x=0, y=0){
  if(img.complete && img.naturalWidth>0) ctx.drawImage(img, x, y);
}
function drawImgSized(img, x, y, w, h){
  if(img.complete && img.naturalWidth>0) ctx.drawImage(img, x, y, w, h);
}

const BG_SKY_VARIANTS = [
  loadImg('assets/bg/bg-fondo.png'),
  loadImg('assets/bg/bg-fondo2.png'),
  loadImg('assets/bg/bg-fondo3.png'),
  loadImg('assets/bg/bg-fondo4.png'),
  loadImg('assets/bg/bg-fondo5.png'),
  loadImg('assets/bg/bg-fondo6.png')
];
let BG_SKY = BG_SKY_VARIANTS[0];
function pickRandomSky(){
  BG_SKY = BG_SKY_VARIANTS[Math.floor(Math.random()*BG_SKY_VARIANTS.length)];
}

// cartel "find:" que aparece arriba junto al ícono del objetivo (drawtarget)
const BG_FIND = loadImg('assets/bg/bg-find.png');
// coordenadas del texto dentro del png, para centrarlo junto al ícono
const FIND_LABEL_BOUNDS = {x0:17, y0:30, x1:163, y1:107};

const BG_MOUNTAIN_VARIANTS = [
  loadImg('assets/bg/bg-montana.png'),
  loadImg('assets/bg/bg-montana2.png'),
  loadImg('assets/bg/bg-montana3.png'),
  loadImg('assets/bg/bg-montana4.png'),
  loadImg('assets/bg/bg-montana5.png'),
  loadImg('assets/bg/bg-montana6.png')
];
let BG_MOUNTAIN = BG_MOUNTAIN_VARIANTS[0];
function pickRandomMountain(){
  const idx = Math.floor(Math.random()*BG_MOUNTAIN_VARIANTS.length);
  BG_MOUNTAIN = BG_MOUNTAIN_VARIANTS[idx];
}

const CLOUD_VARIANTS = [
  loadImg('assets/bg/bg-nubes.png'),
  loadImg('assets/bg/bg-nubes3.png'),
  loadImg('assets/bg/bg-nubes4.png')
];
const CLOUD_W = 131, CLOUD_H = 71;
const CLOUD_COUNT = 3;
let clouds = [];
for(let i=0;i<CLOUD_COUNT;i++){
  clouds.push({
    x: rand(-CLOUD_W, W),
    y: rand(30, 260),
    speed: rand(14, 24),
    img: choice(CLOUD_VARIANTS) // cada nube tiene su propio sprite al azar
  });
}

const BG_SUN_VARIANTS = [
  loadImg('assets/bg/bg-sol.png'),
  loadImg('assets/bg/bg-sol1.png'),
  loadImg('assets/bg/bg-sol2.png'),
  loadImg('assets/bg/bg-sol3.png'),
  loadImg('assets/bg/bg-sol4.png'),
  loadImg('assets/bg/bg-sol5.png'),
  loadImg('assets/bg/bg-sol6.png'),
  loadImg('assets/bg/bg-sol7.png'),
  loadImg('assets/bg/bg-sol8.png')
];
let BG_SUN = BG_SUN_VARIANTS[0];
function pickRandomSun(){
  BG_SUN = choice(BG_SUN_VARIANTS);
}

function updateClouds(dt){
  for(const c of clouds){
    c.x += c.speed * dt/1000;
    if(c.x > W) c.x = -CLOUD_W;
  }
}

// estado del juego
// tiempo inicial: en modo difícil arrancamos con mucho menos margen
const START_TIME_MS_NORMAL = 30000;
const START_TIME_MS_HARD = 10000;
function startTimeMs(){ return isHardMode ? START_TIME_MS_HARD : START_TIME_MS_NORMAL; }
const START_TIME_MS = START_TIME_MS_NORMAL; // valor de referencia para el estado inicial, antes de arrancar partida
const WRONG_CLICK_PENALTY_MS_NORMAL = 5000;
const WRONG_CLICK_PENALTY_MS_HARD = 10000;
function wrongClickPenaltyMs(){ return isHardMode ? WRONG_CLICK_PENALTY_MS_HARD : WRONG_CLICK_PENALTY_MS_NORMAL; }
const TIME_GAIN_MS_NORMAL = 2000;
const TIME_GAIN_MS_HARD = 1000;
function timeGainMs(){ return isHardMode ? TIME_GAIN_MS_HARD : TIME_GAIN_MS_NORMAL; }

// dificultad
// más npcs a medida que subís de score, hasta un tope para que no se llene la pantalla
const BASE_ROUND_NPCS = 3;
const MAX_ROUND_NPCS = 28;
const IMPOSTORS_PER_DIFFICULTY_STEP = 8;
const MAX_SCORE = 9999;
const STATE = { MENU:'menu', PLAYING:'playing', GAMEOVER:'gameover', TUTORIAL:'tutorial', CONFIG:'config', COUNTDOWN:'countdown' };
let gameState = STATE.MENU;
// a qué pantalla volver al cerrar el config (menú o partida en curso)
let stateBeforeConfig = STATE.MENU;

function openConfig(){
  stateBeforeConfig = gameState;
  gameState = STATE.CONFIG;
}

let sprites = [];
let menuSprites = [];   // los personajes de fondo del menú, decorativos nomás
let target = null;
let clickLock = false;
let timeLeft = START_TIME_MS;
let lastSecond = Math.ceil(START_TIME_MS/1000);
let score = 0;
let roundCount = 0; // cuántas rondas (spawnRound) van en la partida actual, usado por el modo Invert
let enemiesKilled = 0;
let chestsOpened = 0; // cofres abiertos en esta partida
let catchStreak = 0; // racha de aciertos, se corta con un click erróneo

// modo versus local: dos turnos, uno por jugador, sobre el mismo mini-juego de
// siempre. No agrega ninguna mecánica nueva, solo reutiliza startNewGame() dos
// veces seguidas y compara los scores al final.
let versusMode = false;
let versusStage = 1;     // 1 = turno del jugador 1, 2 = turno del jugador 2
let versusP1Score = 0;   // score final del jugador 1, guardado al pasar al turno 2

const COUNTDOWN_DURATION_MS = 3000;
let countdownStartTime = 0;

function startCountdown(){
  gameState = STATE.COUNTDOWN;
  countdownStartTime = performance.now();
}

function startVersusMatch(){
  versusMode = true;
  versusStage = 1;
  versusP1Score = 0;
  startCountdown();
}

function rand(min,max){ return Math.random()*(max-min)+min; }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// enemigo (aparte de char_data para que nunca salga como impostor)
// tipos de enemigo: mismo comportamiento, distintos assets. Para agregar uno
// nuevo solo hay que sumar otra entrada acá, no hace falta tocar el resto del código.
const ENEMY_W = 80, ENEMY_H = 112;
// tiempo (ms) que tarda cada enemigo en disparar su splash luego de aparecer
const ENEMY1_SPLASH_TIME = 2000;
const ENEMY2_SPLASH_TIME = 500; // 2s menos que el enemigo 1 (ataca más rápido)

const ENEMY_TYPES = [
  {
    frames: [
      loadImg('assets/pjs/enemy/enemie1-animated-0.png'),
      loadImg('assets/pjs/enemy/enemie1-animated-1.png'),
      loadImg('assets/pjs/enemy/enemie1-animated-2.png')
    ],
    deathImg: loadImg('assets/pjs/enemy/enemie1-death.png'),
    splashImg: loadImg('assets/pjs/enemy/splash2.png'),
    splashTime: ENEMY1_SPLASH_TIME
  },
  {
    frames: [
      loadImg('assets/pjs/enemy/enemie2-animated-0.png'),
      loadImg('assets/pjs/enemy/enemie2-animated-1.png'),
      loadImg('assets/pjs/enemy/enemie2-animated-2.png')
    ],
    deathImg: loadImg('assets/pjs/enemy/enemie2-death.png'),
    splashImg: loadImg('assets/pjs/enemy/splash3.png'),
    splashTime: ENEMY2_SPLASH_TIME
  }
];
const ENEMY_SPAWN_CHANCE = 0.35; // chance de que aparezca al menos un enemigo
// el enemigo 1 (índice 0, el más básico) recién puede empezar a aparecer acá
const ENEMY1_UNLOCK_SCORE_NORMAL = 12;
const ENEMY1_UNLOCK_SCORE_HARD = 0;
function enemy1UnlockScore(){ return isHardMode ? ENEMY1_UNLOCK_SCORE_HARD : ENEMY1_UNLOCK_SCORE_NORMAL; }
// el enemigo 2 (índice 1) recién puede aparecer una vez atrapados estos impostores
const ENEMY2_UNLOCK_SCORE_NORMAL = 40;
const ENEMY2_UNLOCK_SCORE_HARD = 0;
function enemy2UnlockScore(){ return isHardMode ? ENEMY2_UNLOCK_SCORE_HARD : ENEMY2_UNLOCK_SCORE_NORMAL; }
// recién a partir de acá puede aparecer más de un enemigo a la vez en pantalla
const MULTI_ENEMY_UNLOCK_SCORE_NORMAL = 100;
const MULTI_ENEMY_UNLOCK_SCORE_HARD = 17;
function multiEnemyUnlockScore(){ return isHardMode ? MULTI_ENEMY_UNLOCK_SCORE_HARD : MULTI_ENEMY_UNLOCK_SCORE_NORMAL; }
// a partir del segundo enemigo, la chance de sumar uno más sube con la dificultad
// (mismo criterio que IMPOSTORS_PER_DIFFICULTY_STEP), hasta un tope de MAX_ENEMIES en pantalla
const MAX_ENEMIES = 4;
const EXTRA_ENEMY_BASE_CHANCE = 0.08;
const EXTRA_ENEMY_CHANCE_PER_STEP = 0.05;
const EXTRA_ENEMY_CHANCE_MAX = 0.6;
let enemies = [];

function currentDifficultyStep(){
  return Math.floor(score / IMPOSTORS_PER_DIFFICULTY_STEP);
}
function extraEnemyChance(){
  const step = currentDifficultyStep();
  return Math.min(EXTRA_ENEMY_CHANCE_MAX, EXTRA_ENEMY_BASE_CHANCE + step*EXTRA_ENEMY_CHANCE_PER_STEP);
}

// ataque del enemigo
const ENEMY_SPLASH_CLICKS = 3;     // clicks para sacarlo
// cada enemigo puede tener su propio splash activo a la vez; se resuelven de a uno,
// empezando por el último en dispararse (igual que con los sprites, el que queda "arriba" se saca primero)
let splashes = [];

function fireSplash(e){
  splashes.push({clicksLeft: ENEMY_SPLASH_CLICKS, img: e.type.splashImg});
  playEnemyShoot();
}

function drawSplashes(){
  for(const s of splashes){
    const scale = s.clicksLeft / ENEMY_SPLASH_CLICKS;
    const w = W*scale, h = H*scale;
    drawImgSized(s.img, (W-w)/2, (H-h)/2, w, h);
  }
}

// tipos de enemigo disponibles según cuántos impostores lleva atrapados el jugador
function unlockedEnemyTypes(){
  return score >= enemy2UnlockScore() ? ENEMY_TYPES : ENEMY_TYPES.slice(0, 1);
}

function makeEnemy(){
  const w = ENEMY_W, h = ENEMY_H;
  const speed = rand(30, 50);
  const angle = rand(0, Math.PI*2);
  let e, tries = 0;
  do{
    e = {
      type: choice(unlockedEnemyTypes()),
      w, h,
      x: rand(w/2, W-w/2),
      y: rand(FIELD_TOP+h/2, FIELD_BOTTOM-h/2),
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      frame: 0,
      frameTimer: 0,
      frameInterval: rand(120,190),
      turnTimer: rand(600,1800),
      dead: false,
      gravity: 0,
      lifeTimer: 0,
      hasFired: false
    };
    tries++;
  } while((overlapsAny(e, sprites) || overlapsAny(e, enemies) || isBlockedByWorld(e, e.x, e.y)) && tries<25);
  return e;
}

// decide cuántos enemigos aparecen esta ronda: primero si aparece al menos uno,
// después va sumando más de a uno con chance creciente según la dificultad, hasta MAX_ENEMIES
function spawnEnemies(){
  enemies = [];
  if(score < enemy1UnlockScore()) return; // todavía no desbloqueó ni el enemigo más básico
  if(Math.random() >= ENEMY_SPAWN_CHANCE) return;
  enemies.push(makeEnemy());
  if(score < multiEnemyUnlockScore()) return; // todavía no puede aparecer más de uno
  while(enemies.length < MAX_ENEMIES && Math.random() < extraEnemyChance()){
    enemies.push(makeEnemy());
  }
}

const ENEMY_LAUNCH_VY_MIN = 550, ENEMY_LAUNCH_VY_MAX = 700;
const ENEMY_GRAVITY = 1500;

function launchEnemy(e){
  e.dead = true;
  e.vy = -rand(ENEMY_LAUNCH_VY_MIN, ENEMY_LAUNCH_VY_MAX);
  e.gravity = ENEMY_GRAVITY;
  enemiesKilled++;
  trackEnemyKilled();
  playEnemyDeath();
}

function updateDeadEnemy(e, dt){
  const dtS = dt/1000;
  e.vy += e.gravity * dtS;
  e.x += e.vx * dtS;
  e.y += e.vy * dtS;
}

function drawEnemy(e){
  if(!e) return;
  const img = e.dead ? e.type.deathImg : e.type.frames[e.frame];
  if(!img.complete || img.naturalWidth===0) return;
  ctx.save();
  ctx.translate(e.x, e.y);
  if(!e.dead && e.vx < 0) ctx.scale(-1,1);
  ctx.drawImage(img, -e.w/2, -e.h/2, e.w, e.h);
  ctx.restore();
}

// máscaras de colisión sacadas del canal alpha de cada imagen
function buildAlphaMask(img, label, onSettled){
  const state = { data: null };
  function settle(){ if(onSettled) onSettled(); }
  img.onload = function(){
    try{
      const off = document.createElement('canvas');
      off.width = W; off.height = H;
      const offCtx = off.getContext('2d');
      offCtx.drawImage(img, 0, 0);
      const data = offCtx.getImageData(0, 0, W, H).data;
      const mask = new Uint8Array(W*H);
      for(let i=0, p=0; i<data.length; i+=4, p++){
        mask[p] = data[i+3] > 20 ? 1 : 0;
      }
      state.data = mask;
    }catch(err){
      console.warn(`[world] No se pudo leer ${label} (el navegador puede bloquear esto al abrir el HTML directamente con doble click). Prueba sirviendo la carpeta con un servidor local.`, err);
      state.data = null;
    }
    settle();
  };
  img.onerror = function(){
    console.warn(`[world] No se pudo cargar ${label}. Verifica que el archivo está en assets/bg-world/.`);
    state.data = null;
    settle();
  };
  return state;
}

function alphaAt(state, x, y){
  if(!state.data) return null; // todavía no cargó la máscara
  const xi = Math.round(x), yi = Math.round(y);
  if(xi<0 || xi>=W || yi<0 || yi>=H) return 0;
  return state.data[yi*W + xi];
}

// misma idea que buildAlphaMask, pero al tamaño propio del sprite (w x h) en vez de
// toda la pantalla, y esperando a que la imagen cargue si todavía no lo hizo
function buildSpriteMask(img, w, h){
  const state = {data:null, w, h};
  function build(){
    try{
      const off = document.createElement('canvas');
      off.width = w; off.height = h;
      const offCtx = off.getContext('2d');
      offCtx.drawImage(img, 0, 0, w, h);
      const data = offCtx.getImageData(0, 0, w, h).data;
      const mask = new Uint8Array(w*h);
      for(let i=0, p=0; i<data.length; i+=4, p++){
        mask[p] = data[i+3] > 20 ? 1 : 0;
      }
      state.data = mask;
    }catch(err){
      console.warn('[sprite] No se pudo leer la máscara de un sprite (el navegador puede bloquear esto al abrir el HTML directamente con doble click).', err);
      state.data = null;
    }
  }
  if(img.complete && img.naturalWidth>0) build();
  else img.addEventListener('load', build, {once:true});
  return state;
}

// se achica un poco el cuerpo para este chequeo, si no el margen invisible del tronco queda muy grande
const TRUNK_COLLISION_BODY_SCALE = 0.5;

function isTrunkSolid(entity, x, y){
  const idx = BG_TRONCO_VARIANTS.indexOf(BG_TRONCO);
  if(idx < 0) return false;
  const boxes = TRONCO_HITBOXES[idx];
  const bw = entity.w * TRUNK_COLLISION_BODY_SCALE;
  const bh = entity.h * TRUNK_COLLISION_BODY_SCALE;
  const left = x - bw/2, right = x + bw/2;
  const top = y - bh/2, bottom = y + bh/2;
  for(const b of boxes){
    // choque de rectángulos completos, no de un solo punto, para que funcione venga de la dirección que venga
    if(right > b.x0 && left < b.x1 && bottom > b.y0 && top < b.y1) return true;
  }
  return false;
}
function isWalkable(x, y){
  const v = alphaAt(groundMask, x, y);
  return v === null ? true : v === 1; // si la máscara no cargó todavía, dejar pasar
}
// choque contra lago, suelo o tronco
function isBlockedByWorld(entity, x, y){
  if(isLake(x, y)) return true;
  if(!isWalkable(x, y)) return true;
  return isTrunkSolid(entity, x, y);
}

// colisión contra el cofre, solo para el movimiento de sprites/enemigo, no para el spawn
function isChestSolid(entity, x, y){
  for(const c of chests){
    const dx = x-c.x, dy = y-c.y;
    const minD = (Math.max(entity.w, entity.h) + Math.max(c.w, c.h))/2 * 0.55;
    if(Math.hypot(dx,dy) < minD) return true;
  }
  return false;
}

// sprites de los npcs
function makeSprite(cname, vname, isTarget){
  const info = CHAR_DATA[cname];
  const w = info.w, h = info.h;
  // variedad de "estilos de caminar": cada npc sale un poco más lento o más
  // rápido que el resto, y su ciclo de animación acompaña esa velocidad
  // (el que camina rápido también mueve las piernas más rápido), para que
  // no se sienta que todos caminan igual de monótono
  const speed = rand(24, 60);
  const speedT = (speed - 24) / (60 - 24); // 0 = lento, 1 = rápido
  const frameInterval = rand(160, 200) - speedT * 90;
  const angle = rand(0, Math.PI*2);
  // salto "de sorpresa": no ocurre solo caminando, se dispara puntualmente
  // (por ejemplo al hacer click incorrecto sobre el npc). jumpOffset es
  // visual, nunca toca x/y reales, así que no afecta colisiones ni hit-test
  return {
    char: cname, variant: vname, isTarget: isTarget,
    w: w, h: h,
    x: rand(w/2, W-w/2),
    y: rand(FIELD_TOP+h/2, FIELD_BOTTOM-h/2),
    vx: Math.cos(angle)*speed,
    vy: Math.sin(angle)*speed,
    frame: 0,
    frameTimer: 0,
    frameInterval: frameInterval,
    turnTimer: rand(600,1800),
    jumping: false,
    jumpElapsed: 0,
    jumpDuration: rand(320,480),
    jumpHeight: rand(28,50),
    jumpOffset: 0
  };
}

function overlapsAny(s, list){
  for(const o of list){
    const dx = s.x-o.x, dy = s.y-o.y;
    const minD = (Math.max(s.w,s.h)+Math.max(o.w,o.h))/2 * 0.55;
    if(Math.hypot(dx,dy) < minD) return true;
  }
  return false;
}

function spawnRound(){
  sprites = [];
  clickLock = false;
  splashes = [];
  powerupFlies = [];
  freezeTimeLeft = 0;
  if(slowmoTimeLeft > 0 || jumpPartyTimeLeft > 0) setMainMusicRate(1); // por si quedó slow-mo o jump party activo de la ronda anterior
  slowmoTimeLeft = 0;
  jumpPartyTimeLeft = 0;
  roundCount++; // usado por el modo Invert para alternar la pantalla cada 1 ronda

  const tChar = choice(CHAR_NAMES);
  const tVariants = variantsOf(tChar);
  const tVariant = choice(tVariants);
  target = {char: tChar, variant: tVariant};

  const count = Math.min(
    BASE_ROUND_NPCS + Math.floor(score / IMPOSTORS_PER_DIFFICULTY_STEP),
    MAX_ROUND_NPCS
  );
  const otherVariants = tVariants.filter(v=>v!==tVariant);

  const list = [{char:tChar, variant:tVariant, isTarget:true}];
  for(let i=1;i<count;i++){
    if(otherVariants.length>0 && Math.random() < 0.78){
      list.push({char:tChar, variant:choice(otherVariants), isTarget:false});
    } else {
      const oChar = choice(CHAR_NAMES.filter(c=>c!==tChar));
      list.push({char:oChar, variant:choice(variantsOf(oChar)), isTarget:false});
    }
  }
  for(let i=list.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [list[i],list[j]] = [list[j],list[i]];
  }

  for(const spec of list){
    let s, tries=0;
    do{
      s = makeSprite(spec.char, spec.variant, spec.isTarget);
      tries++;
    } while((overlapsAny(s, sprites) || isBlockedByWorld(s, s.x, s.y)) && tries<25);
    sprites.push(s);
  }

  spawnEnemies();
  chests = spawnChests();
}

// spawn de cofres por ronda: en modo normal sigue siendo 1 intento con la
// chance de siempre (como antes). en modo Lucky (MODE_LUCKY / config-hard3)
// siempre aparecen al menos LUCKY_MIN_CHESTS, y hasta LUCKY_MAX_CHESTS si la
// chance extra (CHEST_SPAWN_CHANCE) acompaña
const LUCKY_MIN_CHESTS = 2;
const LUCKY_MAX_CHESTS = 5;
function spawnChests(){
  const list = [];
  if(hardLevel === MODE_LUCKY){
    for(let i=0;i<LUCKY_MIN_CHESTS;i++) list.push(makeChest(list));
    const extraAttempts = LUCKY_MAX_CHESTS - LUCKY_MIN_CHESTS;
    for(let i=0;i<extraAttempts;i++){
      if(Math.random() < CHEST_SPAWN_CHANCE) list.push(makeChest(list));
    }
  } else {
    if(Math.random() < CHEST_SPAWN_CHANCE) list.push(makeChest(list));
  }
  return list;
}

// entre los drops normales: chance de freeze, de slow-mo, de jump party, y el resto va a tiempo (ver openchest)
const CHEST_FREEZE_CHANCE = 0.34;
const CHEST_SLOWMO_CHANCE = 0.33;
const CHEST_JUMPPARTY_CHANCE = 0.15;
let chests = [];
let powerupFlies = []; // los power-ups que ya salieron volando (uno por cofre abierto)

const CHEST_FAKE_TIME_PENALTY_MS = 3000; // -3s si es falso

// triggerJump, que ya ignora el llamado si el sprite sigue en el aire, así que
// cada npc encadena salto tras salto solo mientras dura el power-up)

function makeChest(existingChests){
  const w = CHEST_W, h = CHEST_H;
  // el dorado se decide primero, si sale dorado ya no puede ser falso
  const isGold = Math.random() < CHEST_GOLD_CHANCE;
  const isFake = !isGold && Math.random() < chestFakeChance();
  let c, tries = 0;
  do{
    c = {
      w, h,
      x: rand(w/2, W-w/2),
      y: rand(FIELD_TOP+h/2, FIELD_BOTTOM-h/2),
      opened: false,
      isFake,
      isGold
    };
    tries++;
  } while((overlapsAny(c, sprites) || overlapsAny(c, enemies) || overlapsAny(c, existingChests||[]) || isBlockedByWorld(c, c.x, c.y)) && tries<25);
  return c;
}

function isChestClick(c, x, y){
  return !!c && Math.abs(x-c.x)<=c.w/2 && Math.abs(y-c.y)<=c.h/2;
}

// tira el power-up con la misma física de arco que launchenemy(), y decide acá qué power-up es
function openChest(c){
  c.opened = true;
  playChestOpen();
  chestsOpened++;
  trackChestOpened();

  let img, w, h;
  if(c.isGold){
    // el dorado solo da tiempo, pero más
    img = POWERUP_TIME_IMG; w = POWERUP_W; h = POWERUP_H;
    timeLeft += CHEST_GOLD_TIME_BONUS_MS;
    spawnTimeGainPopup(c.x, c.y, performance.now(), formatTimeGainText(CHEST_GOLD_TIME_BONUS_MS));
  } else if(c.isFake){
    img = POWERUP_BAD_ITEM_IMG; w = POWERUP_BAD_ITEM_W; h = POWERUP_BAD_ITEM_H;
    timeLeft = Math.max(0, timeLeft - CHEST_FAKE_TIME_PENALTY_MS);
    spawnTimeGainPopup(c.x, c.y, performance.now(), formatTimeGainText(-CHEST_FAKE_TIME_PENALTY_MS), true);
  } else {
    // un solo roll: freeze, slow-mo, jump party, el resto tiempo
    const roll = Math.random();
    if(roll < CHEST_FREEZE_CHANCE){
      img = POWERUP_FREEZE_IMG; w = POWERUP_FREEZE_W; h = POWERUP_FREEZE_H;
      freezeTimeLeft = FREEZE_DURATION_MS;
      playFreeze();
    } else if(roll < CHEST_FREEZE_CHANCE + CHEST_SLOWMO_CHANCE){
      img = POWERUP_SLOWMO_IMG; w = POWERUP_SLOWMO_W; h = POWERUP_SLOWMO_H;
      slowmoTimeLeft = SLOWMO_DURATION_MS;
      setMainMusicRate(SLOWMO_MUSIC_RATE);
    } else if(roll < CHEST_FREEZE_CHANCE + CHEST_SLOWMO_CHANCE + CHEST_JUMPPARTY_CHANCE){
      img = POWERUP_JUMPPARTY_IMG; w = POWERUP_JUMPPARTY_W; h = POWERUP_JUMPPARTY_H;
      jumpPartyTimeLeft = JUMPPARTY_DURATION_MS;
      setMainMusicRate(JUMPPARTY_MUSIC_RATE);
    } else {
      img = POWERUP_TIME_IMG; w = POWERUP_W; h = POWERUP_H;
      const bonus = choice(CHEST_TIME_BONUS_OPTIONS_MS);
      timeLeft += bonus;
      spawnTimeGainPopup(c.x, c.y, performance.now(), formatTimeGainText(bonus));
    }
  }

  const angle = rand(0, Math.PI*2);
  const speed = rand(30, 50);
  powerupFlies.push({
    x: c.x, y: c.y,
    w, h, img,
    vx: Math.cos(angle)*speed,
    vy: -rand(ENEMY_LAUNCH_VY_MIN, ENEMY_LAUNCH_VY_MAX),
    gravity: ENEMY_GRAVITY
  });
}

function updatePowerupFly(dt){
  if(powerupFlies.length === 0) return;
  const dtS = dt/1000;
  for(const pf of powerupFlies){
    pf.vy += pf.gravity * dtS;
    pf.x += pf.vx * dtS;
    pf.y += pf.vy * dtS;
  }
  powerupFlies = powerupFlies.filter(pf => pf.y <= H + pf.h);
}

  const img = c.opened ? openImg : closedImg;

// se dibuja arriba de todo mientras dura el "jump party": tiñe la pantalla
// con colores arcoíris pulsantes + haces de luz giratorios, efecto disco
function drawJumpPartyOverlay(now){
  if(jumpPartyTimeLeft <= 0) return;
  const t = now * 0.001;
  const hueOffset = (now / 6) % 360;

  // capa de color de fondo, cicla por todo el arcoíris
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.35;
  const grad = ctx.createLinearGradient(0, 0, W, H);
  for(let i=0;i<=6;i++){
    const hue = (hueOffset + i*60) % 360;
    grad.addColorStop(i/6, `hsl(${hue},100%,50%)`);
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // haces de luz tipo disco girando desde arriba
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.22;
  const beamCount = 6;
  for(let i=0;i<beamCount;i++){
    const angle = t * 0.6 + i * (Math.PI*2/beamCount);
    const hue = (hueOffset + i*60) % 360;
    ctx.save();
    ctx.translate(W/2, 0);
    ctx.rotate(angle);
    const beamGrad = ctx.createLinearGradient(0, 0, 0, H*1.3);
    beamGrad.addColorStop(0, `hsla(${hue},100%,60%,0.6)`);
    beamGrad.addColorStop(1, `hsla(${hue},100%,60%,0)`);
    ctx.fillStyle = beamGrad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-45, H*1.3);
    ctx.lineTo(45, H*1.3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

// estos personajes miran a la izquierda por defecto, el resto mira a la derecha (lista hecha a mano)
const WALK_SPRITE_CHARS = new Set(['cross', 'emiliana', 'martoline', 'matromy', 'seth', 'gatito', 'milo', 'triangulo']);

function drawSprite(s){
  const frames = CHAR_DATA[s.char].variants[s.variant];
  const img = frames[s.frame];
  if(!img.complete || img.naturalWidth===0) return;
  ctx.save();
  // jumpOffset es solo visual: sube el dibujo sin mover la posición real (s.y)
  ctx.translate(s.x, s.y - (s.jumpOffset||0));
  // si mira a la izquierda por defecto, el flip es al revés
  const facesLeftByDefault = WALK_SPRITE_CHARS.has(s.char);
  const shouldFlip = facesLeftByDefault ? (s.vx > 0) : (s.vx < 0);
  if(shouldFlip) ctx.scale(-1,1);
  ctx.drawImage(img, -s.w/2, -s.h/2, s.w, s.h);
  ctx.restore();
}

// hit-test real de un click contra un sprite: usa la máscara de alpha del frame actual
// (misma silueta que ves dibujada) en vez del rectángulo completo, así un click no "roba"
// el margen transparente de un sprite vecino superpuesto. Si la máscara todavía no cargó,
// cae de respaldo al rectángulo para no romper el juego en el primer instante.
function isSpriteHit(s, x, y){
  const masks = CHAR_DATA[s.char].masks[s.variant];
  const mask = masks && masks[s.frame];
  if(!mask || !mask.data){
    return Math.abs(x-s.x)<=s.w/2 && Math.abs(y-s.y)<=s.h/2;
  }
  if(Math.abs(x-s.x)>s.w/2 || Math.abs(y-s.y)>s.h/2) return false;

  // mismo flip que aplica drawSprite, para que el hit-test coincida con lo dibujado
  const facesLeftByDefault = WALK_SPRITE_CHARS.has(s.char);
  const shouldFlip = facesLeftByDefault ? (s.vx > 0) : (s.vx < 0);
  let localX = x - (s.x - s.w/2);
  if(shouldFlip) localX = s.w - localX;
  const localY = y - (s.y - s.h/2);
  const xi = Math.floor(localX), yi = Math.floor(localY);
  if(xi<0 || xi>=s.w || yi<0 || yi>=s.h) return false;
  return mask.data[yi*s.w + xi] === 1;
}

// mismo orden con el que drawWorldEntitiesDepthSorted dibuja (de atrás hacia adelante),
// pero invertido: para resolver un click hay que probar primero el sprite que queda
// visualmente encima, no el que se agregó último al array
function spritesFrontToBack(){
  return [...sprites].sort((a,b)=> (b.y+b.h/2) - (a.y+a.h/2));
}

// mismo criterio que spritesFrontToBack: el que queda más abajo en pantalla se dibuja
// encima, así que hay que probarlo primero para que el click acierte al que se ve
function enemiesFrontToBack(){
  return [...enemies].sort((a,b)=> (b.y+b.h/2) - (a.y+a.h/2));
}

// feedback táctil: un anillo simple que crece y se desvanece en cada toque,
// para que se sienta el input en pantalla táctil. Mismo patrón que timeGainPopups
// (array + easeOutCubic), no usa ningún asset.
const TOUCH_FX_DURATION = 350; // ms
const TOUCH_FX_MAX_RADIUS = 46;
let touchEffects = [];

function spawnTouchEffect(x, y, now){
  touchEffects.push({x, y, startTime: now});
}

function drawTouchEffects(now){
  for(let i=touchEffects.length-1; i>=0; i--){
    const t = touchEffects[i];
    const elapsed = Math.max(0, now - t.startTime);
    if(elapsed >= TOUCH_FX_DURATION){ touchEffects.splice(i,1); continue; }

    const eased = easeOutCubic(elapsed / TOUCH_FX_DURATION);
    ctx.save();
    ctx.globalAlpha = 1 - eased;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(t.x, t.y, TOUCH_FX_MAX_RADIUS * eased, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

// popup de tiempo ganado/perdido (ej. "+2", "-3") que aparece al encontrar
// un impostor o abrir un cofre. El texto se arma solo a partir del valor en
// ms, así que nunca se desincroniza si después cambiás esos tiempos.
const TIME_GAIN_POPUP = {
  font: '30px Impact, "Arial Narrow", sans-serif',
  fill: '#7CFC7C',
  fillPenalty: '#FF5C5C', // color para los popups negativos
  stroke: '#000000',
  lineWidth: 5,
  slideDistanceY: 36,   // cuánto sube
  slideMs: 220,         // cuánto tarda en subir
  totalMs: 900          // duración total con el fade
};
let timeGainPopups = [];

// ms -> texto del popup, ej. 2000 -> "+2", -3000 -> "-3"
function formatTimeGainText(ms){
  const seconds = Math.round(ms/1000);
  return (seconds >= 0 ? '+' : '') + seconds;
}

function spawnTimeGainPopup(x, y, now, text, isPenalty){
  timeGainPopups.push({x, y, startTime: now, text: text || formatTimeGainText(timeGainMs()), isPenalty: !!isPenalty});
}

function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }

// fade negro de entrada, apenas arranca el juego
const INTRO_FADE_MS = 700;
let introFadeStartTime = null; // null = no está activo

function drawIntroFade(now){
  if(introFadeStartTime === null) return;
  const t = Math.min(1, (now - introFadeStartTime) / INTRO_FADE_MS);
  if(t >= 1){ introFadeStartTime = null; return; }
  ctx.save();
  ctx.globalAlpha = 1 - easeOutCubic(t);
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawTimeGainPopups(now){
  for(let i=timeGainPopups.length-1; i>=0; i--){
    const p = timeGainPopups[i];
    const elapsed = now - p.startTime;
    if(elapsed >= TIME_GAIN_POPUP.totalMs){
      timeGainPopups.splice(i,1);
      continue;
    }

    const slideT = Math.min(1, elapsed / TIME_GAIN_POPUP.slideMs);
    const yOffset = -TIME_GAIN_POPUP.slideDistanceY * easeOutCubic(slideT);

    let alpha = 1;
    if(elapsed > TIME_GAIN_POPUP.slideMs){
      const fadeT = (elapsed - TIME_GAIN_POPUP.slideMs) / (TIME_GAIN_POPUP.totalMs - TIME_GAIN_POPUP.slideMs);
      alpha = 1 - fadeT;
    }

    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.font = TIME_GAIN_POPUP.font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = TIME_GAIN_POPUP.lineWidth;
    ctx.strokeStyle = TIME_GAIN_POPUP.stroke;
    ctx.strokeText(p.text, p.x, p.y + yOffset);
    ctx.fillStyle = p.isPenalty ? TIME_GAIN_POPUP.fillPenalty : TIME_GAIN_POPUP.fill;
    ctx.fillText(p.text, p.x, p.y + yOffset);
    ctx.restore();
  }
}

// niveles del botón de dificultad (config-hard1..config-hard5). cada nivel es
// un modo independiente, no una escala progresiva: NORMAL es el default,
// HARD es el modo difícil de siempre, LUCKY es normal + más cofres, BLIND es
// normal pero el ícono de arriba siempre muestra blind.png en vez del
// personaje real, INVERT alterna la pantalla de cabeza cada 1 ronda.
const MODE_NORMAL = 0; // config-hard1
const MODE_HARD   = 1; // config-hard2
const MODE_LUCKY  = 2; // config-hard3
const MODE_BLIND  = 3; // config-hard4
const MODE_INVERT = 4; // config-hard5
let hardLevel = MODE_NORMAL;
// true solo en el modo difícil real (MODE_HARD); los demás modos (incluido
// Lucky) usan los valores normales de tiempo/penalización/enemigos/etc.
let isHardMode = false;
function cycleHardLevel(){
  hardLevel = (hardLevel + 1) % CONFIG_HARD_VARIANTS.length;
  isHardMode = hardLevel === MODE_HARD;
  playUiSound1();
}

// modo Invert: la pantalla se da vuelta verticalmente cada 1 ronda, y en la
// siguiente ronda vuelve a la normalidad, alternando así sucesivamente.
// roundCount arranca en 1 en la primera ronda (ver spawnRound), así que las
// rondas pares son las que aparecen invertidas.
function isScreenFlipped(){
  return hardLevel === MODE_INVERT && (roundCount % 2 === 0);
}

// color del timer según el modo activo
function timerColor(){
  switch(hardLevel){
    case MODE_HARD:   return HUD.fillHard;
    case MODE_LUCKY:  return HUD.fillLucky;
    case MODE_BLIND:  return HUD.fillBlind;
    case MODE_INVERT: return HUD.fillInvert;
    default:          return HUD.fill;
  }
}

// la dificultad solo se puede cambiar fuera de una partida en curso (si el

}

// loop de update
let lastFrameTime = performance.now();
// dibuja npcs, enemigo y cofre ordenados por altura, para que se tapen bien entre ellos
function drawWorldEntitiesDepthSorted(){
  const items = [];
  for(const s of sprites) items.push({depth: s.y + s.h/2, draw: () => drawSprite(s)});
  for(const e of enemies) items.push({depth: e.y + e.h/2, draw: () => drawEnemy(e)});
  for(const c of chests) items.push({depth: c.y + c.h/2, draw: () => drawChest(c)});
  items.sort((a, b) => a.depth - b.depth);
  for(const it of items) it.draw();
}

function update(dt){
  // el power-up en vuelo sigue cayendo aunque esté todo congelado
  updatePowerupFly(dt);

  // cuenta regresiva del slow-mo, al llegar a 0 la música vuelve a la normalidad
  // (si el jump party sigue activo, el pitch se lo deja a él en vez de resetear)
  if(slowmoTimeLeft > 0){
    slowmoTimeLeft = Math.max(0, slowmoTimeLeft - dt);
    if(slowmoTimeLeft <= 0 && jumpPartyTimeLeft <= 0) setMainMusicRate(1);
  }

  // cuenta regresiva del jump party (los npcs siguen encadenando saltos en stepSprites mientras dure)
  if(jumpPartyTimeLeft > 0){
    jumpPartyTimeLeft = Math.max(0, jumpPartyTimeLeft - dt);
    if(jumpPartyTimeLeft <= 0 && slowmoTimeLeft <= 0) setMainMusicRate(1);
  }

  if(freezeTimeLeft > 0){
    // congelado: no se mueve nada ni baja el tiempo
    freezeTimeLeft = Math.max(0, freezeTimeLeft - dt);
    return;
  }

  timeLeft = Math.max(0, timeLeft - dt);

  const currentSecond = Math.ceil(timeLeft/1000);
  if(currentSecond !== lastSecond){
    lastSecond = currentSecond;
    playTick();
  }

  if(timeLeft <= 0){
    if(versusMode && versusStage === 1){
      // termina el turno de P.1 sin pasar por la pantalla de game over:
      // guarda su score y arranca directo el contador para P.2
      versusP1Score = score;
      versusStage = 2;
      startCountdown();
    } else {
      gameState = STATE.GAMEOVER;
    }
    return;
  }

  for(const s of sprites) stepSprites(s, dt);
  for(let i=enemies.length-1; i>=0; i--){
    const e = enemies[i];
    if(e.dead){
      updateDeadEnemy(e, dt);
      if(e.y > H + e.h) enemies.splice(i,1); // ya salió de pantalla
    } else {
      stepSprites(e, dt);
      e.lifeTimer += dt;
      if(!e.hasFired && e.lifeTimer >= e.type.splashTime){
        e.hasFired = true;
        fireSplash(e);
      }
    }
  }
}

// mueve y anima un sprite: rebota en los bordes, choca con el lago/suelo, gira al azar
function stepSprites(s, dt){
  {
    s.turnTimer -= dt;
    if(s.turnTimer <= 0){
      const curAngle = Math.atan2(s.vy, s.vx);
      const newAngle = curAngle + rand(-1.2,1.2);
      const speed = Math.hypot(s.vx,s.vy);
      s.vx = Math.cos(newAngle)*speed;
      s.vy = Math.sin(newAngle)*speed;
      s.turnTimer = rand(600,1800);
    }

    // en slow-mo solo se reduce lo que se mueve, el resto sigue normal
    const moveDt = slowmoTimeLeft > 0 ? dt * SLOWMO_SPEED_SCALE : dt;
    const nx = s.x + s.vx * moveDt/1000;
    const ny = s.y + s.vy * moveDt/1000;

    if(isBlockedByWorld(s, nx, ny) || isChestSolid(s, nx, ny)){
      s.vx *= -1;
      s.vy *= -1;
    } else {
      s.x = nx;
      s.y = ny;
    }

    if(s.x < s.w/2){ s.x=s.w/2; s.vx*=-1; }
    if(s.x > W-s.w/2){ s.x=W-s.w/2; s.vx*=-1; }
    if(s.y < FIELD_TOP+s.h/2){ s.y=FIELD_TOP+s.h/2; s.vy*=-1; }
    if(s.y > FIELD_BOTTOM-s.h/2){ s.y=FIELD_BOTTOM-s.h/2; s.vy*=-1; }

    s.frameTimer += dt;
    if(s.frameTimer > s.frameInterval){
      s.frameTimer = 0;
      s.frame = (s.frame+1)%3;
    }

    // jump party: mientras dure, cada npc encadena salto tras salto
    // (triggerJump ya ignora el llamado si sigue en el aire, así que esto
    // simplemente lo re-dispara apenas termina el salto anterior). Se limita
    // a entidades que tienen props de salto (los npcs, no los enemigos)
    if(jumpPartyTimeLeft > 0 && s.jumpHeight !== undefined) triggerJump(s);

    // salto: solo afecta s.jumpOffset (offset visual al dibujar), nunca s.x/s.y,
    // así que no interfiere con colisiones, rebotes ni hit-test.
    // se dispara puntualmente con triggerJump(s), no por timer propio.
    if(s.jumping){
      s.jumpElapsed += dt;
      if(s.jumpElapsed >= s.jumpDuration){
        s.jumping = false;
        s.jumpOffset = 0;
      } else {
        const t = s.jumpElapsed / s.jumpDuration;
        s.jumpOffset = Math.sin(t*Math.PI) * s.jumpHeight;
      }
    }
  }
}

// dispara el salto de un sprite al instante (ej: al hacer click incorrecto sobre él)
// si ya está saltando, se ignora el nuevo disparo para que termine bien el salto actual
// en vez de cortarlo y reiniciarlo (lo que se veía raro si spameaban clicks)
function triggerJump(s){
  if(s.jumping) return;
  s.jumping = true;
  s.jumpElapsed = 0;
}

function loop(now){
  const dt = Math.min(50, now - lastFrameTime);
  lastFrameTime = now;

  ctx.clearRect(0,0,W,H);

  // contador de 3s: pantalla aislada, no toca nada del resto del loop.
  // al terminar, arranca la partida con el mismo startNewGame() de siempre.
  if(gameState === STATE.COUNTDOWN){
    updateClouds(dt);
    drawBackground();
    drawForegroundBackground();
    drawCountdown(now);
    drawIntroFade(now);
    drawTouchEffects(now);
    if(now - countdownStartTime >= COUNTDOWN_DURATION_MS) startNewGame();
    requestAnimationFrame(loop);
    return;
  }

  if(gameState === STATE.PLAYING) update(dt);

  // si el config se abrió durante una partida, hay que seguir mostrando los npcs reales de fondo
  const showingMenuBackdrop =
    gameState === STATE.MENU || gameState === STATE.TUTORIAL ||
    (gameState === STATE.CONFIG && stateBeforeConfig !== STATE.PLAYING);

  if(showingMenuBackdrop){
    for(const s of menuSprites) stepSprites(s, dt);
  }
  updateClouds(dt);

  if(showingMenuBackdrop){
    drawBackground();
    for(const s of menuSprites) drawSprite(s);
    drawForegroundBackground();
    if(gameState === STATE.TUTORIAL){
      drawTutorial();
    } else if(gameState === STATE.CONFIG){
      drawConfig(now);
    } else {
      drawMenu(now);
    }
  } else {
    const flipped = gameState === STATE.PLAYING && isScreenFlipped();
    ctx.save();
    if(flipped){ ctx.translate(0, H); ctx.scale(1, -1); } // modo Invert: pantalla de cabeza esta ronda
    ctx.save();
    if(gameState === STATE.GAMEOVER) ctx.filter = `blur(${GAMEOVER_BG_BLUR_PX}px)`;
    drawBackground();
    drawWorldEntitiesDepthSorted();
    drawPowerupFly();
    drawForegroundBackground();
    drawSplashes();
    ctx.restore();
    if(gameState === STATE.GAMEOVER){
      drawFreezeOverlay();
      drawJumpPartyOverlay(now);
      drawGameOver(now);
    } else if(gameState === STATE.CONFIG){
      drawTarget();
      drawTimer();
      drawScoreHUD();
      drawTimeGainPopups(now);
      drawFreezeOverlay();
      drawJumpPartyOverlay(now);
      drawConfig(now);
    } else {
      drawTarget();
      drawTimer();
      drawScoreHUD();
      drawTimeGainPopups(now);
      drawFreezeOverlay();
      drawJumpPartyOverlay(now);
    }
    ctx.restore();
  }

  drawIntroFade(now);
  drawTouchEffects(now);

  requestAnimationFrame(loop);
}

// clicks e input
function getPos(evt){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width/rect.width;
  const scaleY = canvas.height/rect.height;
  const cx = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
  const cy = (evt.touches ? evt.touches[0].clientY : evt.clientY) - rect.top;
  return {x: cx*scaleX, y: cy*scaleY};
}

function handleClick(evt){
  evt.preventDefault();
  const p = getPos(evt);
  spawnTouchEffect(p.x, p.y, performance.now());

  if(gameState === STATE.COUNTDOWN) return; // el contador no reacciona a clicks

  if(gameState === STATE.MENU){
    if(alphaAt(menuStartMask, p.x, p.y) === 1){
      versusMode = false;
      startNewGame();
    } else if(alphaAt(menuOptionsMask, p.x, p.y) === 1){
      openConfig();
    } else if(alphaAt(menuVsMask, p.x, p.y) === 1){
      startVersusMatch();
    } else if(alphaAt(menuMedalMask, p.x, p.y) === 1){
      // TODO: sin acción todavía
    }
    return;
  }

  if(gameState === STATE.CONFIG){
    const hardMask = configHardMasks[hardLevel];
    const muteMask = isMuted ? configMuteMask2 : configMuteMask1;
    if(alphaAt(configExitMask, p.x, p.y) === 1){
      gameState = stateBeforeConfig;
    } else if(alphaAt(hardMask, p.x, p.y) === 1 && canChangeDifficulty()){
      cycleHardLevel();
    } else if(alphaAt(muteMask, p.x, p.y) === 1){
      toggleMute();
    }
    return;
  }

  if(gameState === STATE.TUTORIAL){
    if(alphaAt(tutorialExitMask, p.x, p.y) === 1){
      gameState = STATE.MENU;
    } else {
      advanceTutorialPage();
    }
    return;
  }

  if(gameState === STATE.GAMEOVER){
    if(isRetryButtonHit(p.x, p.y)){
      if(versusMode){
        // solo se llega acá tras perder el turno de P.2 (P.1 pasa directo al
        // contador sin pasar por esta pantalla): reinicia el versus desde P.1
        startVersusMatch();
      } else {
        startNewGame();
      }
    } else if(isQuitButtonHit(p.x, p.y)){
      versusMode = false;
      versusStage = 1;
      spawnMenuDecoration();
      gameState = STATE.MENU;
      playMenuMusic();
    }
    return;
  }

  // modo Invert: la pantalla se ve dada vuelta esta ronda, pero las
  // posiciones reales de los sprites siguen sin invertir, así que hay que
  // convertir la coordenada del click/touch a ese mismo espacio antes de
  // testear colisiones (incluyendo el chequeo de la zona del HUD de arriba)
  if(gameState === STATE.PLAYING && isScreenFlipped()){
    p.y = H - p.y;
  }

  if(p.y < FIELD_TOP) return;

  if(splashes.length > 0){
    // se resuelve primero el último en dispararse (queda visualmente arriba de los demás)
    const s = splashes[splashes.length-1];
    s.clicksLeft--;
    if(s.clicksLeft <= 0) splashes.pop();
    return;
  }

  for(const e of enemiesFrontToBack()){
    if(!e.dead && Math.abs(p.x-e.x)<=e.w/2 && Math.abs(p.y-e.y)<=e.h/2){
      launchEnemy(e);
      return;
    }
  }

  for(const c of chests){
    if(!c.opened && isChestClick(c, p.x, p.y)){
      openChest(c);
      return;
    }
  }

  if(clickLock) return;

  for(const s of spritesFrontToBack()){
    if(isSpriteHit(s, p.x, p.y)){
      if(s.isTarget){
        clickLock = true;
        score = Math.min(score + 1, MAX_SCORE);
        if(isScoreMilestone(score)) scoreMilestoneStartTime = performance.now();
        trackImpostorCaught();
        catchStreak++;
        timeLeft += timeGainMs();
        spawnTimeGainPopup(s.x, s.y, performance.now(), formatTimeGainText(timeGainMs()));
        playFound();
        pickRandomBackground();
        spawnRound();
      } else {
        catchStreak = 0;
        timeLeft = Math.max(0, timeLeft - wrongClickPenaltyMs());
        playWrong();
        triggerJump(s);
      }
      return;
    }
  }

}

function pickRandomBackground(){
  pickRandomSky();
  pickRandomMountain();
  pickRandomSun();
  pickRandomTrees();
  pickRandomGround();
  pickRandomLake();
  pickRandomBushes();
}

function startNewGame(){
  gameState = STATE.PLAYING;
  pickRandomBackground();
  playMainMusic();
  score = 0;
  scoreMilestoneStartTime = -Infinity;
  enemiesKilled = 0;
  chestsOpened = 0;
  catchStreak = 0;
  timeLeft = startTimeMs();
  lastSecond = Math.ceil(startTimeMs()/1000);
  timeGainPopups = [];
  splashes = [];
  roundCount = 0; // arranca siempre en pantalla normal (round 1 = sin invertir)
  spawnRound();
}

canvas.addEventListener('click', handleClick);
canvas.addEventListener('touchstart', handleClick, {passive:false});

// esc abre el config durante una partida, o cierra config/tutorial si ya están abiertos
window.addEventListener('keydown', function(evt){
  if(evt.key !== 'Escape') return;
  if(gameState === STATE.PLAYING){
    openConfig();
    playUiSound2();
  } else if(gameState === STATE.CONFIG){
    gameState = stateBeforeConfig;
  } else if(gameState === STATE.TUTORIAL){
    gameState = STATE.MENU;
  }
});

// arranque
// espera a que carguen las máscaras de suelo/lago antes del primer spawn
function startGame(){
  // arranca en el menú: generamos los personajes de fondo y empieza el loop
  introFadeStartTime = performance.now();
  spawnMenuDecoration();
  requestAnimationFrame(loop);
}
if(worldMasksPending <= 0) startGame();
